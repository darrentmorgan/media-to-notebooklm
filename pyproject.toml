[project]
name = "media-to-notebooklm"
version = "0.1.0"
description = "NotebookLM notebook builder from YouTube sources"
requires-python = ">=3.11"
dependencies = [
  "notebooklm-py[browser]==0.3.4",
  "yt-dlp>=2024.0.0",
  "python-dotenv>=1.0",
  "click>=8.1",
]

[project.optional-dependencies]
telegram = ["python-telegram-bot>=21"]

[project.scripts]
yt-to-nblm = "media_to_nblm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/media_to_nblm"]
